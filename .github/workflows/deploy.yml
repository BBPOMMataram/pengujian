name: Deploy Pengujian to server

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy to pengujian.bbpommataram.id
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST || 'bbpommataram.id' }}
          username: ${{ secrets.SSH_USER || 'bbpom9725' }}
          port: ${{ secrets.SSH_PORT || 56710 }}
          key: ${{ secrets.SSH_KEY }}
          debug: true
          script: |
            echo "=== [Deploy] Target Directory Setup ==="
            echo "User: $(whoami) | Home: $HOME | PWD: $(pwd)"

            APP_DIR="/home/pengujian.bbpommataram.id/PENGUJIAN"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/BBPOMMataram/pengujian.git"

            # Pastikan direktori target ada
            if ! mkdir -p "$APP_DIR" 2>/dev/null; then
                if [ -d "/home/bbpommataram.id" ] && [ -w "/home/bbpommataram.id" ]; then
                    APP_DIR="/home/bbpommataram.id/PENGUJIAN"
                else
                    APP_DIR="$HOME/PENGUJIAN"
                fi
                mkdir -p "$APP_DIR"
            fi

            echo "[Deploy] Using APP_DIR: $APP_DIR"
            cd "$APP_DIR" || exit 1

            # Inisialisasi git jika folder belum memiliki .git (mengatasi 'fatal: not a git repository')
            if [ ! -d ".git" ]; then
                echo "[Deploy] Initializing git in $APP_DIR..."
                git init
                git remote add origin "$REPO_URL" 2>/dev/null || git remote set-url origin "$REPO_URL"
            else
                git remote set-url origin "$REPO_URL" 2>/dev/null || true
            fi

            echo "[Deploy] Register safe directory..."
            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true

            echo "[Deploy] Fetch latest code..."
            if git fetch origin master --force 2>/dev/null; then
                git reset --hard origin/master || exit 1
            elif git fetch origin main --force 2>/dev/null; then
                git reset --hard origin/main || exit 1
            else
                git fetch "$REPO_URL" HEAD --force || exit 1
                git reset --hard FETCH_HEAD || exit 1
            fi

            echo "[Deploy] Current commit: $(git rev-parse --short HEAD)"

            echo "[Deploy] Configuring .env..."
            if [ ! -f ".env" ]; then
                echo "[Deploy] Creating .env from .env.example..."
                cp .env.example .env
            fi

            # Set APP_URL
            if grep -q "^APP_URL=" .env; then
                sed -i "s|^APP_URL=.*|APP_URL=https://pengujian.bbpommataram.id|" .env
            else
                echo "APP_URL=https://pengujian.bbpommataram.id" >> .env
            fi

            # Set APP_ENV dan APP_DEBUG
            sed -i "s|^APP_ENV=.*|APP_ENV=production|" .env 2>/dev/null || true
            sed -i "s|^APP_DEBUG=.*|APP_DEBUG=false|" .env 2>/dev/null || true

            # Buat folder framework yang dibutuhkan Laravel jika belum ada
            mkdir -p storage/framework/cache/data
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs
            mkdir -p bootstrap/cache
            mkdir -p database

            # Pastikan file SQLite database ada
            if grep -q "^DB_CONNECTION=sqlite" .env || ! grep -q "^DB_CONNECTION=" .env; then
                touch database/database.sqlite
                echo "[Deploy] SQLite database verified at $APP_DIR/database/database.sqlite"
            fi

            echo "[Deploy] Installing Composer dependencies..."
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-dev --prefer-dist --no-interaction --no-ansi --optimize-autoloader || exit 1

            # Pastikan APP_KEY terisi
            if ! grep -q "^APP_KEY=base64:" .env; then
                echo "[Deploy] Generating application key..."
                php artisan key:generate --force || true
            fi

            echo "[Deploy] Running migrations..."
            php artisan migrate --force || exit 1

            echo "[Deploy] Optimizing caches..."
            php artisan optimize:clear || exit 1
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true

            echo "[Deploy] Linking storage..."
            php artisan storage:link 2>/dev/null || true

            echo "[Deploy] Fixing directory and file permissions..."
            SERVER_USER=$(whoami)
            chown -R "$SERVER_USER:$SERVER_USER" storage bootstrap/cache database 2>/dev/null || true

            # Berikan hak akses penuh ke storage, cache, dan database SQLite
            chmod -R 775 storage bootstrap/cache database 2>/dev/null || true
            if [ -f "database/database.sqlite" ]; then
                chmod 664 database/database.sqlite 2>/dev/null || true
            fi

            touch storage/logs/laravel.log 2>/dev/null || true
            chmod 664 storage/logs/laravel.log 2>/dev/null || true

            # Touch public/index.php to reload LiteSpeed / PHP-FPM opcache
            touch public/index.php 2>/dev/null || true

            echo "=== [Deploy] Successfully deployed to https://pengujian.bbpommataram.id ✅ ==="
