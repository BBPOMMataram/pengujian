name: Deploy Pengujian to server

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy to pengujian.bbpommataram.id
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST || 'bbpommataram.id' }}
          username: ${{ secrets.SSH_USER || 'bbpom9725' }}
          port: ${{ secrets.SSH_PORT || 56710 }}
          key: ${{ secrets.SSH_KEY }}
          debug: true
          script: |
            echo "=== [Deploy] Detecting Pengujian Path on Server ==="
            echo "User: $(whoami) | Home: $HOME | PWD: $(pwd)"

            APP_DIR="/home/bbpommataram.id/PENGUJIAN"

            if [ -z "$APP_DIR" ]; then
                echo "[Deploy] Candidate paths not found. Searching server for pengujian directory..."
                FOUND=$(find /home /var/www "$HOME" -maxdepth 3 -iname "*pengujian*" -type d 2>/dev/null | head -n 1)
                if [ -n "$FOUND" ]; then
                    APP_DIR="$FOUND"
                    echo "[Deploy] Found via search: $APP_DIR"
                else
                    echo "[Deploy] Directory not found. Setting default installation path..."
                    if [ -d "/home/bbpommataram.id" ] && [ -w "/home/bbpommataram.id" ]; then
                        APP_DIR="/home/bbpommataram.id/pengujian.bbpommataram.id"
                    elif [ -d "/home/bbpom9725" ] && [ -w "/home/bbpom9725" ]; then
                        APP_DIR="/home/bbpom9725/pengujian.bbpommataram.id"
                    else
                        APP_DIR="$HOME/pengujian.bbpommataram.id"
                    fi
                    echo "[Deploy] Cloning repository into $APP_DIR..."
                    git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/BBPOMMataram/pengujian.git" "$APP_DIR" || exit 1
                fi
            fi

            echo "[Deploy] Using target directory: $APP_DIR"
            cd "$APP_DIR" || exit 1

            echo "[Deploy] Register safe directory..."
            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true

            echo "[Deploy] Fetch latest code..."
            if git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/BBPOMMataram/pengujian.git" master:refs/remotes/origin/master --force 2>/dev/null; then
                git reset --hard origin/master || exit 1
            else
                git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/BBPOMMataram/pengujian.git" main:refs/remotes/origin/main --force || exit 1
                git reset --hard origin/main || exit 1
            fi

            echo "[Deploy] Current commit: $(git rev-parse --short HEAD)"

            echo "[Deploy] Configuring .env..."
            if [ ! -f "$APP_DIR/.env" ]; then
                echo "[Deploy] Creating .env from .env.example..."
                cp "$APP_DIR/.env.example" "$APP_DIR/.env"
            fi

            # Ensure APP_URL is correctly pointed to pengujian.bbpommataram.id
            if grep -q "^APP_URL=" "$APP_DIR/.env"; then
                sed -i "s|^APP_URL=.*|APP_URL=https://pengujian.bbpommataram.id|" "$APP_DIR/.env"
            else
                echo "APP_URL=https://pengujian.bbpommataram.id" >> "$APP_DIR/.env"
            fi

            # Ensure production settings
            sed -i "s|^APP_ENV=.*|APP_ENV=production|" "$APP_DIR/.env" 2>/dev/null || true
            sed -i "s|^APP_DEBUG=.*|APP_DEBUG=false|" "$APP_DIR/.env" 2>/dev/null || true

            # Ensure SQLite database exists if SQLite connection is used
            if grep -q "^DB_CONNECTION=sqlite" "$APP_DIR/.env" || ! grep -q "^DB_CONNECTION=" "$APP_DIR/.env"; then
                mkdir -p "$APP_DIR/database"
                touch "$APP_DIR/database/database.sqlite"
                echo "[Deploy] SQLite database verified at $APP_DIR/database/database.sqlite"
            fi

            echo "[Deploy] Installing Composer dependencies..."
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-dev --prefer-dist --no-interaction --no-ansi --optimize-autoloader || exit 1

            # Ensure APP_KEY exists
            if ! grep -q "^APP_KEY=base64:" "$APP_DIR/.env"; then
                echo "[Deploy] Generating application key..."
                php artisan key:generate --force || true
            fi

            echo "[Deploy] Running migrations..."
            php artisan migrate --force || exit 1

            echo "[Deploy] Optimizing caches..."
            php artisan optimize:clear || exit 1
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true

            echo "[Deploy] Linking storage..."
            php artisan storage:link 2>/dev/null || true

            echo "[Deploy] Fixing directory and file permissions..."
            SERVER_USER=$(whoami)
            chown -R "$SERVER_USER:$SERVER_USER" "$APP_DIR/storage" "$APP_DIR/bootstrap/cache" "$APP_DIR/database" 2>/dev/null || true

            # Directory permissions (775 / 755)
            find "$APP_DIR/storage" -type d -exec chmod 775 {} \; 2>/dev/null || true
            find "$APP_DIR/bootstrap/cache" -type d -exec chmod 775 {} \; 2>/dev/null || true

            # File permissions (664 / 644)
            find "$APP_DIR/storage" -type f -exec chmod 664 {} \; 2>/dev/null || true
            find "$APP_DIR/bootstrap/cache" -type f -exec chmod 664 {} \; 2>/dev/null || true

            # SQLite database permissions if present
            if [ -f "$APP_DIR/database/database.sqlite" ]; then
                chmod 664 "$APP_DIR/database/database.sqlite" 2>/dev/null || true
                chmod 775 "$APP_DIR/database" 2>/dev/null || true
            fi

            # Laravel log file
            touch "$APP_DIR/storage/logs/laravel.log" 2>/dev/null || true
            chmod 664 "$APP_DIR/storage/logs/laravel.log" 2>/dev/null || true

            # Touch public/index.php to reload LiteSpeed / PHP-FPM opcache
            touch "$APP_DIR/public/index.php" 2>/dev/null || true

            echo "=== [Deploy] Successfully deployed to https://pengujian.bbpommataram.id ✅ ==="
